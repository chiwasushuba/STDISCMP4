spring.application.name=course-service
spring.main.web-application-type=none
# gRPC uses daemon threads; retain the standalone application lifecycle.
spring.main.keep-alive=true
rpc.server.port=${GRPC_PORT:9090}
security.public-key=${JWT_PUBLIC_KEY:file:secrets/public.pem}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/course}
spring.datasource.username=${DB_USER:enrollment}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.data-source-properties.socketTimeout=5
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.flyway.enabled=true
