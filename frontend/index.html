<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AnimoRoll</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div id="app">
      <main class="app-loading" aria-live="polite">Opening AnimoRoll…</main>
      <noscript>Enable JavaScript to use AnimoRoll.</noscript>
    </div>

    <template id="login">
      <main class="login-layout">
        <section class="login-story" aria-label="AnimoRoll student portal">
          <a class="brand brand-light" href="/login">
            <span class="brand-mark" aria-hidden="true">✳</span>
            <span
              >AnimoRoll<span class="brand-sub">UNIVERSITY PORTAL</span></span
            >
          </a>
          <div class="story-copy">
            <span class="eyebrow">YOUR NEXT CHAPTER</span>
            <h2>A clear path.<br />A bright future.</h2>
            <p>
              Your courses, your progress, your possibilities.<br />One place to
              make it all happen.
            </p>
            <div class="orbit" aria-hidden="true">
              <div class="orbit-inner"></div>
              <span class="orbit-star">✳</span
              ><span class="orbit-label">Keep moving forward.</span>
            </div>
          </div>
          <div class="story-footer">Learn with purpose. Go further.</div>
        </section>
        <section class="login-form-panel">
          <div class="login-form-wrap">
            <span class="eyebrow accent">WELCOME TO ANIMOROLL</span>
            <h1>Good to see you.</h1>
            <p class="muted">Sign in to your university account to continue.</p>
            <div class="notice error" role="alert" hidden></div>
            <div class="notice success" role="status" hidden>
              You’re signed out of this browser.
            </div>
            <div class="notice warning" role="alert" hidden>
              The identity service is unavailable. Your server session could not
              be revoked and will expire automatically.
            </div>
            <form action="/api/login" method="post" class="stack">
              <label for="email">University email</label>
              <input
                id="email"
                name="email"
                type="email"
                maxlength="200"
                autocomplete="username"
                placeholder="you@animoroll.edu"
                required
              />
              <label for="password">Password</label>
              <input
                id="password"
                name="password"
                type="password"
                maxlength="100"
                autocomplete="current-password"
                placeholder="Enter your password"
                required
              />
              <button class="button primary full" type="submit">
                Sign in <span aria-hidden="true">↗</span>
              </button>
            </form>
            <p class="login-help">
              Students and faculty use the same sign-in.<br />Your account opens
              the right workspace for you.
            </p>
            <div class="login-footnote">
              <span class="small-star" aria-hidden="true">✳</span> A little
              planning. A great semester.
            </div>
          </div>
        </section>
      </main>
    </template>

    <template id="workspace">
      <a class="skip-link" href="#main">Skip to content</a>
      <div class="app-shell">
        <aside class="sidebar">
          <a class="brand" href="/">
            <span class="brand-mark" aria-hidden="true">✳</span>
            <span
              >AnimoRoll<span class="brand-sub">UNIVERSITY PORTAL</span></span
            >
          </a>
          <div class="workspace-label"></div>
          <nav class="main-nav" aria-label="Main navigation">
            <a href="/"
              ><span class="nav-icon" aria-hidden="true">◫</span>Overview</a
            >
            <a href="/courses"
              ><span class="nav-icon" aria-hidden="true">▤</span>Course
              catalog</a
            >
            <a href="/enrollment"
              ><span class="nav-icon" aria-hidden="true">▦</span>My
              enrollment</a
            >
            <a href="/grades"
              ><span class="nav-icon" aria-hidden="true">◷</span>Grade
              history</a
            >
            <a href="/faculty"
              ><span class="nav-icon" aria-hidden="true">▤</span>Classes &amp;
              grades</a
            >
          </nav>
          <div class="sidebar-note">
            <span class="small-star" aria-hidden="true">✳</span
            ><strong>Your next chapter<br />starts here.</strong>
            <p>Make room for what’s next.</p>
          </div>
          <div class="sidebar-bottom">
            <div class="profile">
              <span class="avatar" aria-hidden="true"></span>
              <div><strong></strong><span></span></div>
            </div>
            <form action="/api/signout" method="post">
              <button class="signout" type="submit">
                Sign out <span aria-hidden="true">↗</span>
              </button>
            </form>
          </div>
        </aside>
        <div class="main-column">
          <header class="topbar">
            <div>
              <span class="breadcrumb">Workspace</span
              ><span class="breadcrumb-slash" aria-hidden="true">/</span
              ><strong data-breadcrumb></strong>
            </div>
            <span class="term-chip"
              ><span class="status-dot" aria-hidden="true"></span
              ><span data-current-term></span
            ></span>
          </header>
          <main id="main" class="main-content" tabindex="-1">
            <div class="page-heading"><h1 tabindex="-1"></h1></div>
            <div class="notice success" role="status" hidden></div>
            <div class="notice error" role="alert" hidden></div>
            <div data-workspace-view></div>
            <footer class="page-footer"><span>AnimoRoll</span></footer>
          </main>
        </div>
      </div>
    </template>

    <template id="dashboard">
      <section class="welcome-banner">
        <div>
          <span class="eyebrow">A NEW SEMESTER. NEW POSSIBILITIES.</span>
          <h2>Welcome back, <span data-first-name></span>.</h2>
          <p>Your next great idea might start with your next class.</p>
          <a class="button light" href="/courses"
            >Explore courses <span aria-hidden="true">↗</span></a
          >
        </div>
        <div class="banner-art" aria-hidden="true">
          <div class="art-ring"></div>
          <span>✳</span>
        </div>
      </section>
      <section class="stats-grid" aria-label="Semester summary">
        <div class="stat">
          <span>Enrolled courses</span><strong data-enrolled-count>—</strong
          ><small>Your confirmed selections</small>
        </div>
        <div class="stat">
          <span>Academic units</span><strong data-unit-count>—</strong
          ><small>For the current semester</small>
        </div>
        <div class="stat">
          <span>Open courses</span><strong data-open-count>—</strong
          ><small>Ready for your next step</small>
        </div>
      </section>
      <section class="section-block">
        <div class="section-heading">
          <div>
            <span class="eyebrow muted">BUILD YOUR SEMESTER</span>
            <h2>Find something worth learning.</h2>
          </div>
          <a class="text-link" href="/courses"
            >View catalog <span aria-hidden="true">↗</span></a
          >
        </div>
        <div
          data-course-feature
          role="region"
          aria-label="Course overview"
        ></div>
        <p class="sr-only" aria-live="polite" aria-atomic="true"></p>
      </section>
      <section class="section-block">
        <div class="section-heading">
          <div>
            <span class="eyebrow muted">KEEP MOVING FORWARD</span>
            <h2>Your academic record</h2>
          </div>
          <a class="text-link" href="/grades"
            >View grades <span aria-hidden="true">↗</span></a
          >
        </div>
        <div
          data-grade-feature
          role="region"
          aria-label="Academic record"
        ></div>
        <p class="sr-only" aria-live="polite" aria-atomic="true"></p>
      </section>
    </template>

    <template id="record-summary">
      <div class="record-summary">
        <span class="record-icon" aria-hidden="true">↗</span>
        <div>
          <strong
            ><span data-grade-count></span> published grade records</strong
          >
          <p class="muted">Your hard work, semester by semester.</p>
        </div>
        <a class="button secondary" href="/grades">Review progress</a>
      </div>
    </template>

    <template id="courses">
      <form class="filter-bar" action="/courses" method="get">
        <div class="search-field">
          <label class="sr-only" for="search">Search courses</label
          ><span aria-hidden="true">⌕</span>
          <input
            id="search"
            name="search"
            type="search"
            maxlength="100"
            placeholder="Search by course name or code…"
          />
        </div>
        <label class="sr-only" for="department">Department</label>
        <select id="department" name="department">
          <option value="">All departments</option>
          <option>Computer Science</option>
          <option>Mathematics</option>
          <option>General Education</option>
        </select>
        <button class="button primary" type="submit">Find courses</button>
      </form>
      <div data-course-feature role="region" aria-label="Catalog results"></div>
      <p class="sr-only" aria-live="polite" aria-atomic="true"></p>
    </template>

    <template id="course-results">
      <div class="result-line">
        <strong><span data-course-count></span> courses</strong
        ><span>Current semester offerings</span>
      </div>
      <div class="course-grid"></div>
      <div class="empty-state" hidden>
        <h2>No courses found.</h2>
        <p>Try another search or choose a different department.</p>
        <a class="button secondary" href="/courses">Clear filters</a>
      </div>
    </template>

    <template id="enrollment">
      <div
        data-course-feature
        role="region"
        aria-label="Enrollment results"
      ></div>
      <p class="sr-only" aria-live="polite" aria-atomic="true"></p>
    </template>

    <template id="enrollment-results">
      <div class="enrollment-strip">
        <div>
          <span class="eyebrow">YOUR SEMESTER PLAN</span>
          <h2>
            <span data-enrolled-count></span> courses.
            <span data-unit-count></span> units. Your next chapter.
          </h2>
        </div>
        <a class="button primary" href="/courses"
          >Add a course <span aria-hidden="true">+</span></a
        >
      </div>
      <div class="empty-state" hidden>
        <span class="empty-icon" aria-hidden="true">▤</span>
        <h2>Your semester is a blank canvas.</h2>
        <p>
          Choose your first course from the catalog. Your confirmed selections
          will appear here.
        </p>
        <a class="button primary" href="/courses"
          >Explore courses <span aria-hidden="true">↗</span></a
        >
      </div>
      <div class="course-grid"></div>
    </template>

    <template id="course-card">
      <article class="course-card">
        <div class="course-card-top">
          <span class="course-code"></span><span class="tag"></span>
        </div>
        <h3></h3>
        <p class="course-department">
          <span data-department></span><span aria-hidden="true"> · </span
          ><span data-units></span> units
        </p>
        <div class="course-meta">
          <div>
            <span class="meta-icon" aria-hidden="true">◷</span
            ><span data-schedule></span>
          </div>
          <div>
            <span class="meta-icon" aria-hidden="true">⌖</span
            ><span data-room></span>
          </div>
          <div>
            <span class="meta-icon" aria-hidden="true">○</span
            ><span data-faculty></span>
          </div>
        </div>
        <div class="course-bottom">
          <span data-seats-left><strong></strong> seats left</span>
          <span class="confirmed" hidden>✓ Enrollment confirmed</span>
          <span class="muted" data-closed hidden>Enrollment closed</span>
          <form action="/api/enroll" method="post" data-enroll-form hidden>
            <input type="hidden" name="courseId" />
            <button type="submit" class="enroll-button">
              Enroll <span aria-hidden="true">+</span>
            </button>
          </form>
        </div>
      </article>
    </template>

    <template id="grades">
      <div data-grade-feature role="region" aria-label="Grade history"></div>
      <p class="sr-only" aria-live="polite" aria-atomic="true"></p>
    </template>

    <template id="grade-results">
      <form class="filter-bar grade-filter" action="/grades" method="get">
        <label for="term">Academic semester</label>
        <select id="term" name="term">
          <option value="">All semesters</option>
        </select>
        <button class="button secondary" type="submit">Show grades</button>
      </form>
      <div class="table-panel">
        <div
          class="table-scroll"
          role="region"
          aria-label="Published grades"
          tabindex="0"
        >
          <table>
            <caption class="sr-only">
              Published grades
            </caption>
            <thead>
              <tr>
                <th scope="col">Course</th>
                <th scope="col">Semester</th>
                <th scope="col">Units</th>
                <th scope="col">Grade</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="empty-state" hidden>
          <h2>No published grades yet.</h2>
          <p>Grades appear here after your faculty publishes them.</p>
        </div>
      </div>
      <p class="table-note">
        Grading scale: 1.00 is the highest grade · INC = Incomplete · DRP =
        Dropped
      </p>
    </template>

    <template id="grade-row">
      <tr>
        <td><strong></strong><span class="cell-sub"></span></td>
        <td data-term></td>
        <td data-units></td>
        <td><span class="grade-pill"></span></td>
      </tr>
    </template>

    <template id="faculty">
      <div
        data-grade-feature
        role="region"
        aria-label="Teaching workspace"
      ></div>
      <p class="sr-only" aria-live="polite" aria-atomic="true"></p>
    </template>

    <template id="faculty-results">
      <nav class="class-tabs" aria-label="Assigned classes"></nav>
      <div class="empty-state" hidden>
        <h2>No assigned classes yet.</h2>
        <p>Your classes will appear when teaching assignments are available.</p>
      </div>
      <div class="faculty-grid">
        <section class="table-panel">
          <div class="panel-header">
            <div>
              <span class="eyebrow accent" data-course-code></span>
              <h2></h2>
              <p class="muted">
                <span data-roster-count></span> students in the class roster
              </p>
            </div>
            <span class="tag">YOUR CLASS</span>
          </div>
          <div
            class="table-scroll"
            role="region"
            aria-label="Class grade roster"
            tabindex="0"
          >
            <table>
              <caption class="sr-only">
                Class grade roster
              </caption>
              <thead>
                <tr>
                  <th scope="col">Student</th>
                  <th scope="col">Student ID</th>
                  <th scope="col">Grade</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
        <section class="upload-panel">
          <span class="eyebrow accent">FROM FILE TO FINAL</span>
          <h2>Publish class grades</h2>
          <p class="muted">
            Download the roster, fill in the grades, then upload your CSV to
            review it.
          </p>
          <a class="text-link" data-template-download
            >Download roster CSV <span aria-hidden="true">↓</span></a
          >
          <form
            action="/api/faculty/preview"
            method="post"
            enctype="multipart/form-data"
            class="stack upload-form"
          >
            <input type="hidden" name="code" /><input
              type="hidden"
              name="term"
            />
            <label for="grade-file">Grade file (.csv)</label>
            <input
              id="grade-file"
              name="file"
              type="file"
              accept=".csv,text/csv"
              required
              aria-describedby="file-help"
              data-max-bytes="262144"
            />
            <p id="file-help" class="field-help">
              Up to 500 rows · 256 KB maximum<br />Header:
              <code>student_id,grade</code>
            </p>
            <button class="button primary full" type="submit">
              Preview grades <span aria-hidden="true">↗</span>
            </button>
          </form>
          <div class="upload-note">
            Grades: 1.00–3.00 in steps of 0.25, 4.00, 5.00, INC, or DRP. The
            entire file must be valid before any grades are saved.
          </div>
        </section>
      </div>
    </template>

    <template id="class-tab"
      ><a><strong></strong><span></span></a
    ></template>
    <template id="roster-row"
      ><tr>
        <td><strong></strong></td>
        <td data-student-id></td>
        <td><span></span></td></tr
    ></template>
    <template id="preview-row"
      ><tr>
        <td data-student-id></td>
        <td data-grade></td></tr
    ></template>

    <template id="grade-preview">
      <section class="preview-panel">
        <div class="section-heading">
          <div>
            <h2 tabindex="-1"><span data-row-count></span> ready for review</h2>
            <p class="muted">
              Publishing updates the class roster and student grade history.
            </p>
          </div>
        </div>
        <div
          class="table-scroll"
          role="region"
          aria-label="Grade upload preview"
          tabindex="0"
        >
          <table>
            <caption class="sr-only">
              Grade upload preview
            </caption>
            <thead>
              <tr>
                <th scope="col">Student ID</th>
                <th scope="col">New grade</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="preview-actions">
          <form action="/api/faculty/publish" method="post">
            <input type="hidden" name="previewId" /><button
              class="button primary"
              type="submit"
            >
              Confirm &amp; publish grades
            </button>
          </form>
          <form action="/api/faculty/discard" method="post">
            <input type="hidden" name="previewId" /><button
              class="button secondary"
              type="submit"
            >
              Discard preview
            </button>
          </form>
        </div>
      </section>
    </template>

    <template id="feature-error">
      <div class="unavailable">
        <strong></strong>
        <p></p>
        <button class="text-link" type="button">Try again</button>
      </div>
    </template>
  </body>
</html>
