spring.application.name=web-app
rpc.orchestrator.target=${ORCHESTRATOR_TARGET:localhost:9090}
server.port=${PORT:8080}
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
spring.servlet.multipart.max-file-size=256KB
spring.servlet.multipart.max-request-size=300KB
spring.servlet.multipart.resolve-lazily=true
server.error.include-message=never
